<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gentle Care Tracker - Dose Logger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2beeba",
                        "background-light": "#f6f8f7",
                        "background-dark": "#10221d",
                        "gentle-sage": "#7C9A92",
                        "gentle-rose": "#E89D9D",
                        "gentle-lavender": "#B8B8D1",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    boxShadow: {
                        "soft": "0 8px 24px -6px rgba(124, 154, 146, 0.15)",
                        "inner-soft": "inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)"
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Spline Sans", sans-serif;
        }
        /* Custom range slider styling for a softer feel */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
        }
        input[type=range]:focus {
            outline: none; 
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- Mobile Container -->
<div class="w-full max-w-md bg-white dark:bg-[#152a25] min-h-screen sm:min-h-[800px] sm:h-auto sm:rounded-[3rem] shadow-2xl flex flex-col relative overflow-hidden">
<!-- Header -->
<header class="flex items-center justify-between p-6 pt-8 pb-4">
<button class="text-slate-900 dark:text-slate-100 p-2 rounded-full hover:bg-background-light dark:hover:bg-background-dark transition-colors">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<h1 class="text-slate-900 dark:text-slate-100 text-lg font-bold tracking-tight">Log Dose</h1>
<div class="w-10"></div> <!-- Spacer for visual balance -->
</header>
<!-- Content Scroll Area -->
<div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-32">
<!-- Medication Context Card -->
<div class="bg-background-light dark:bg-background-dark rounded-[2rem] p-6 mb-8 flex items-center gap-4 shadow-soft">
<div class="w-16 h-16 rounded-full bg-white dark:bg-[#1a332d] flex items-center justify-center shrink-0 shadow-sm relative overflow-hidden">
<img alt="Abstract medicine packaging with soft colors" class="w-full h-full object-cover opacity-80" data-alt="Soft focused medicine bottle image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsG9P1KQvSFk6dcBF7UwXUAAkDKACw57rH-q_4OU8FQl9wks-A7p0dvWMC17F6LVAXVl3rTngVtEqzeYVXEPfnx0XL7LJ2FoMSJXfSJTJqjB-qwUnB38WgZSKpePfEvHlXFV6UgvvKnapvtfciC6o91nfrl7-gToMJWHT5c27J0HctbEm72OwL1XvBz_3ymz66ixTE60BgUYA9viudHvBr2vpZyVQsIGwOef9AZbq8NW_Pte8_tDwiFjCX3SZM1MJW99zzJym_gtw"/>
</div>
<div class="flex-1">
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight">Ibuprofen</h2>
<div class="flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-gentle-sage text-sm">child_care</span>
<p class="text-gentle-sage font-medium text-sm">For Leo</p>
</div>
</div>
<button class="bg-white dark:bg-[#1a332d] text-slate-900 dark:text-slate-100 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-100 dark:border-slate-800">
                    Edit
                </button>
</div>
<!-- Dosage Section -->
<div class="mb-10">
<label class="block text-slate-500 dark:text-slate-400 text-sm font-bold uppercase tracking-wider mb-6 text-center">How much?</label>
<div class="flex items-center justify-between gap-4">
<!-- Minus Button -->
<button class="w-16 h-16 rounded-full bg-background-light dark:bg-background-dark text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center justify-center transition-all hover:scale-105 active:scale-95 shadow-inner-soft">
<span class="material-symbols-outlined text-4xl">remove</span>
</button>
<!-- Large Display -->
<div class="flex flex-col items-center justify-center min-w-[80px]">
<span class="text-6xl font-display font-bold text-slate-900 dark:text-slate-100 tracking-tighter">5</span>
<div class="relative mt-1">
<select class="appearance-none bg-transparent border-none text-gentle-sage font-bold text-xl py-0 pl-0 pr-6 focus:ring-0 cursor-pointer">
<option value="ml">ml</option>
<option value="mg">mg</option>
<option value="drops">drops</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-gentle-sage text-sm pointer-events-none">expand_more</span>
</div>
</div>
<!-- Plus Button -->
<button class="w-16 h-16 rounded-full bg-primary text-slate-900 flex items-center justify-center shadow-lg shadow-primary/30 transition-all hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-4xl">add</span>
</button>
</div>
<!-- Visual Volume Indicator (Slider approximation) -->
<div class="mt-8 px-4">
<div class="h-3 bg-background-light dark:bg-background-dark rounded-full w-full relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary w-1/3 rounded-full"></div>
</div>
<div class="flex justify-between mt-2 text-xs text-slate-400 font-medium px-1">
<span>0ml</span>
<span>15ml</span>
</div>
</div>
</div>
<!-- Weight Check Section -->
<div class="mb-8">
<div class="flex items-center justify-between mb-3 px-2">
<label class="text-slate-500 dark:text-slate-400 text-sm font-bold uppercase tracking-wider">Current Weight</label>
<span class="text-xs text-gentle-sage bg-primary/10 px-2 py-1 rounded-full">Verified 2d ago</span>
</div>
<div class="bg-primary/10 dark:bg-primary/5 rounded-[2rem] p-5 flex items-center justify-between border border-primary/20 transition-all active:scale-[0.99]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-white dark:bg-[#1a332d] flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined">monitor_weight</span>
</div>
<div>
<span class="block text-2xl font-bold text-slate-900 dark:text-slate-100 leading-none">14 <span class="text-base text-slate-500 font-medium">kg</span></span>
<span class="text-xs text-slate-500 dark:text-slate-400">Safe dose: 4.5 - 7ml</span>
</div>
</div>
<button class="text-slate-900 dark:text-slate-100 font-bold text-sm bg-white dark:bg-[#1a332d] px-4 py-2 rounded-full shadow-sm">
                        Confirm
                    </button>
</div>
</div>
<!-- Time Picker -->
<div class="mb-6">
<div class="flex items-center justify-between mb-3 px-2">
<label class="text-slate-500 dark:text-slate-400 text-sm font-bold uppercase tracking-wider">Time given</label>
</div>
<div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
<!-- Option: Just Now (Active) -->
<button class="flex-shrink-0 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-6 py-3 rounded-full font-bold text-sm shadow-lg shadow-slate-200 dark:shadow-none flex items-center gap-2">
<span class="material-symbols-outlined text-lg">schedule</span>
                        Just now
                    </button>
<!-- Option: 15m ago -->
<button class="flex-shrink-0 bg-background-light dark:bg-background-dark text-slate-500 dark:text-slate-400 px-6 py-3 rounded-full font-bold text-sm border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        15m ago
                    </button>
<!-- Option: 30m ago -->
<button class="flex-shrink-0 bg-background-light dark:bg-background-dark text-slate-500 dark:text-slate-400 px-6 py-3 rounded-full font-bold text-sm border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        30m ago
                    </button>
</div>
</div>
</div>
<!-- Sticky Bottom Action -->
<div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-white via-white to-transparent dark:from-[#152a25] dark:via-[#152a25] pt-12">
<button class="w-full bg-primary hover:bg-[#25dcb0] text-slate-900 h-16 rounded-full font-bold text-lg shadow-xl shadow-primary/25 flex items-center justify-center gap-2 transition-all transform active:scale-[0.98]">
<span class="material-symbols-outlined">check_circle</span>
                Save Log
            </button>
<p class="text-center text-xs text-slate-400 mt-4 font-medium">Next dose will be in 6 hours</p>
</div>
</div>
</body></html>
