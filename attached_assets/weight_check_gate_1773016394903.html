<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gentle Care Tracker - Weight Check</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2beeba",
                        "primary-content": "#0d1b18", // Dark text for contrast on bright primary
                        "background-light": "#f6f8f7",
                        "background-dark": "#10221d",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c302a",
                        "text-main": "#0d1b18",
                        "text-muted": "#4c9a85",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                    boxShadow: {
                        "soft": "0 10px 40px -10px rgba(43, 238, 186, 0.2)",
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex items-center justify-center p-4">
<!-- Mock Background Content (Blurred) -->
<div aria-hidden="true" class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-40 blur-sm flex flex-col">
<!-- Top Bar -->
<div class="flex items-center justify-between p-6">
<div class="flex flex-col">
<span class="text-sm font-bold text-text-muted">GOOD MORNING</span>
<span class="text-xl font-bold text-text-main dark:text-white">Sarah &amp; Leo</span>
</div>
<div class="h-10 w-10 bg-primary/20 rounded-full"></div>
</div>
<!-- Cards in background -->
<div class="px-6 space-y-4">
<div class="bg-white dark:bg-surface-dark p-6 rounded-xl h-32 w-full shadow-sm"></div>
<div class="bg-white dark:bg-surface-dark p-6 rounded-xl h-32 w-full shadow-sm"></div>
<div class="bg-white dark:bg-surface-dark p-6 rounded-xl h-32 w-full shadow-sm"></div>
</div>
</div>
<!-- Overlay Backdrop -->
<div class="fixed inset-0 bg-background-light/60 dark:bg-background-dark/80 backdrop-blur-md z-10"></div>
<!-- Main Modal Card -->
<main class="relative z-20 w-full max-w-md bg-surface-light dark:bg-surface-dark rounded-xl shadow-soft p-6 flex flex-col items-center gap-8 animate-fade-in-up">
<!-- Close Button (Top Right) -->
<div class="w-full flex justify-end">
<button class="text-text-muted hover:text-text-main dark:hover:text-white transition-colors p-2 rounded-full hover:bg-background-light dark:hover:bg-background-dark/50">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<!-- Header Section -->
<div class="text-center space-y-2">
<h1 class="text-3xl font-bold text-text-main dark:text-white tracking-tight">Let's be precise</h1>
<p class="text-text-muted text-lg font-medium">What is Leo's current weight?</p>
</div>
<!-- Weight Input Section -->
<div class="flex flex-col items-center gap-6 w-full">
<!-- Large Input Area with Steppers -->
<div class="flex items-center justify-center gap-4 w-full">
<!-- Minus Button -->
<button aria-label="Decrease weight" class="h-12 w-12 rounded-full bg-background-light dark:bg-background-dark text-text-muted hover:text-primary hover:bg-primary/10 flex items-center justify-center transition-all active:scale-95">
<span class="material-symbols-outlined">remove</span>
</button>
<!-- Numeric Display -->
<div class="relative group">
<input class="peer w-40 text-center text-6xl font-bold bg-transparent border-none p-0 text-text-main dark:text-white focus:ring-0 placeholder-text-muted/30 selection:bg-primary/30" placeholder="14.0" step="0.1" type="number" value="14.2"/>
<span class="absolute top-2 -right-8 text-xl font-bold text-text-muted mt-2">kg</span>
<!-- Underline decoration -->
<div class="absolute -bottom-2 left-0 w-full h-1 bg-background-light dark:bg-background-dark rounded-full overflow-hidden">
<div class="w-full h-full bg-primary origin-left scale-x-0 transition-transform duration-300 peer-focus:scale-x-100"></div>
</div>
</div>
<!-- Plus Button -->
<button aria-label="Increase weight" class="h-12 w-12 rounded-full bg-background-light dark:bg-background-dark text-text-muted hover:text-primary hover:bg-primary/10 flex items-center justify-center transition-all active:scale-95">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<!-- Contextual Info -->
<div class="bg-primary/10 dark:bg-primary/5 rounded-lg px-4 py-2 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">history</span>
<span class="text-sm font-medium text-text-muted">Last logged: 14.0kg (2 weeks ago)</span>
</div>
</div>
<!-- Disclaimer -->
<div class="bg-red-50 dark:bg-red-900/10 p-4 rounded-lg w-full flex items-start gap-3 border border-red-100 dark:border-red-900/20">
<span class="material-symbols-outlined text-red-400 shrink-0" style="font-size: 20px;">info</span>
<p class="text-sm text-red-800 dark:text-red-200 leading-snug">
                Safety first: Dosage will be strictly calculated based on this value. Please verify it's current.
            </p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-[#25dcb0] text-primary-content font-bold text-lg py-4 rounded-full shadow-lg shadow-primary/25 transition-all active:scale-[0.98] flex items-center justify-center gap-2 group">
<span>Calculate Safe Dose</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</main>
<!-- decorative blurred orb behind the modal for "Soft Comfort" feel -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-primary/20 rounded-full blur-3xl -z-10"></div>
</body></html>
